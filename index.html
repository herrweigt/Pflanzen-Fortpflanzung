<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopie oder Mix? – Das Fortpflanzungs-Duell der Pflanzen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8EF;
  --bg2:#EFF4E4;
  --ink:#23303A;
  --ink-soft:#5B6B73;
  --card:#FFFFFF;
  --line:#E3E0CC;
  --mix:#D6336C;
  --mix-deep:#9C2150;
  --mix-tint:#FCEAF1;
  --copy:#0E8388;
  --copy-deep:#0B5E63;
  --copy-tint:#E2F3F2;
  --gold:#DB9A2C;
  --gold-deep:#A66E12;
  --gold-tint:#FBF0DC;
  --profi:#6C4AB6;
  --profi-deep:#4C3184;
  --profi-tint:#EFE9FA;
  --ok:#2E9B5C;
  --bad:#D14343;
  --radius:18px;
  --shadow:0 10px 28px rgba(35,48,58,.10);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B211C; --bg2:#20271F; --ink:#F1EFE4; --ink-soft:#B9C2B4;
    --card:#262D26; --line:#3A4239;
    --mix-tint:#3A2130; --copy-tint:#152B29; --gold-tint:#332A15; --profi-tint:#2A2338;
  }
}
:root[data-theme="dark"]{
  --bg:#1B211C; --bg2:#20271F; --ink:#F1EFE4; --ink-soft:#B9C2B4;
  --card:#262D26; --line:#3A4239;
  --mix-tint:#3A2130; --copy-tint:#152B29; --gold-tint:#332A15; --profi-tint:#2A2338;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0;
  background:linear-gradient(180deg,var(--bg),var(--bg2) 60%);
  color:var(--ink);
  font-family:'Karla',sans-serif;
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;letter-spacing:-.01em;}
p{margin:0 0 14px;}
button{font-family:inherit;}
img,svg{max-width:100%;}
::selection{background:var(--gold-tint);}

#app{max-width:760px;margin:0 auto;padding:18px 18px 90px;}

/* ---------- top bar / progress ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; gap:12px;
  padding:10px 4px 14px;
  background:linear-gradient(180deg,var(--bg) 78%,transparent);
}
.brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;color:var(--ink-soft);white-space:nowrap;}
.brand span.dna{font-size:18px;}
.trail{flex:1;display:flex;gap:3px;height:12px;border-radius:6px;overflow:hidden;background:var(--line);}
.trail i{display:block;flex:1 1 0;min-width:0;height:100%;background:var(--line);transition:background .3s;}
.trail i.done.mix{background:var(--mix);}
.trail i.done.copy{background:var(--copy);}
.trail i.done.gold{background:var(--gold);}
.trail i.done.profi{background:var(--profi);}
.trail i.done.neutral{background:var(--ink-soft);}
.trail i.now{outline:2px solid var(--ink);outline-offset:1px;}
.trail i.go{cursor:pointer;}
.trail i.go:hover{filter:brightness(1.2);}
.pts{background:var(--gold-tint);color:var(--gold-deep);font-weight:700;font-size:.85rem;padding:5px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
.backrow{margin:-6px 0 8px;}
.backbtn{background:none;border:none;color:var(--ink-soft);font-weight:700;font-size:.9rem;cursor:pointer;padding:6px 0;font-family:inherit;}
.backbtn:hover{color:var(--ink);}
.ptsbadge{display:inline-block;background:var(--ok);color:#fff;font-weight:700;font-size:.8rem;padding:2px 9px;border-radius:999px;margin-right:4px;}
.overview{margin-top:18px;padding-top:6px;border-top:1px dashed var(--line);}
.ov-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.93rem;}
.ov-table th,.ov-table td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);}
.again-box{border:1.5px solid var(--gold);background:var(--gold-tint);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.92rem;}
.again-box ul{margin:6px 0 10px 18px;padding:0;}
.btn.small{padding:8px 14px;font-size:.85rem;}
.imgcap{font-size:.8rem;text-align:center;margin:6px 0 0;}
.chip{display:inline-block;margin:4px;padding:8px 14px;border:1.5px solid var(--ink-soft);border-radius:999px;background:var(--card);cursor:grab;font-size:.9rem;font-weight:600;user-select:none;-webkit-user-select:none;}
.chip.sel{background:var(--gold-tint);border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 35%, transparent);}
.pool{min-height:52px;border:1.5px solid var(--line);border-radius:14px;padding:8px;margin:10px 0;background:var(--card);}
.sortmsg{min-height:1.5em;font-weight:600;margin:6px 0;font-size:.93rem;}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.zone{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:96px;cursor:pointer;}
.zone.mix{background:var(--mix-tint);} .zone.copy{background:var(--copy-tint);}
.zone-h{font-weight:700;font-size:.9rem;margin-bottom:6px;}
.zone-empty{color:var(--ink-soft);font-size:.82rem;}
.placed{background:var(--card);border:1.5px solid var(--ok);border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:.88rem;}
.placed .pb{color:var(--ink-soft);font-size:.8rem;margin-top:2px;}
@media (max-width:520px){.zones{grid-template-columns:1fr;}}
.exp-img{width:100%;max-width:420px;border-radius:12px;display:block;margin:10px auto 0;}
.theme-toggle{border:1px solid var(--line);background:var(--card);border-radius:999px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:15px;}

/* ---------- cards / sections ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:24px 22px; margin-bottom:16px; box-shadow:var(--shadow);
}
.route-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;margin-bottom:14px;
}
.route-tag.mix{background:var(--mix-tint);color:var(--mix-deep);}
.route-tag.copy{background:var(--copy-tint);color:var(--copy-deep);}
.route-tag.gold{background:var(--gold-tint);color:var(--gold-deep);}
.route-tag.profi{background:var(--profi-tint);color:var(--profi-deep);}

h1.title{font-size:1.7rem;margin:0 0 10px;line-height:1.15;}
h2.h{font-size:1.32rem;margin:0 0 10px;line-height:1.2;}
h3.h3{font-size:1.05rem;margin:18px 0 8px;}
.lead{font-size:1.06rem;color:var(--ink-soft);}
.muted{color:var(--ink-soft);}

.hero-wrap{margin:6px 0 18px;}

/* ---------- buttons ---------- */
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.btn{
  border:none;cursor:pointer;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15px;
  display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:var(--bg);}
.btn-primary.mix{background:var(--mix);color:#fff;}
.btn-primary.copy{background:var(--copy);color:#fff;}
.btn-primary.gold{background:var(--gold);color:#3a2600;}
.btn-primary.profi{background:var(--profi);color:#fff;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary:disabled{background:var(--line);color:var(--ink-soft);}

/* ---------- illustrations ---------- */
.flower-svg{width:100%;max-width:340px;display:block;margin:0 auto;}

/* ---------- think-first / gated reveal ---------- */
.think-box{border:1.5px dashed var(--ink-soft);border-radius:14px;padding:14px 16px;margin:14px 0;background:var(--card);}
.think-box .tb-label{font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:6px;}
.reveal-gate{text-align:center;padding:10px 0 4px;}

/* ---------- example station cards ---------- */
.stations{display:grid;grid-template-columns:1fr;gap:10px;}
.station{
  border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;background:var(--card);
  transition:border-color .2s, background .2s;
}
.station .head{display:flex;align-items:center;gap:12px;}
.station .icon{font-size:1.6rem;}
.station .name{font-weight:700;font-size:1.02rem;}
.station .sub{font-size:.87rem;color:var(--ink-soft);}
.station .detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.95rem;}
.station.open{border-color:var(--copy);background:var(--copy-tint);}
.station.open .detail{display:block;}
.station .chev{margin-left:auto;color:var(--ink-soft);font-size:.85rem;}

/* ---------- quiz ---------- */
.quiz{border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;background:var(--card);}
.quiz .qhead{display:flex;gap:8px;align-items:flex-start;font-weight:700;margin-bottom:12px;}
.quiz .qnum{background:var(--ink);color:var(--bg);border-radius:50%;width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;}
.opt{
  display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);
  border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:.98rem;color:var(--ink);
}
.opt:hover:not(:disabled){border-color:var(--ink-soft);}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb, var(--ok) 12%, var(--card));}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 10%, var(--card));}
.opt:disabled{cursor:default;}
.feedback{border-radius:12px;padding:12px 14px;margin-top:8px;font-size:.95rem;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:color-mix(in srgb, var(--ok) 14%, var(--card));color:var(--ink);}
.feedback.bad{background:color-mix(in srgb, var(--bad) 12%, var(--card));color:var(--ink);}

/* ---------- hefteintrag ---------- */
.heft{
  position:relative;
  border-radius:14px;
  background:
    repeating-linear-gradient(var(--card),var(--card) 27px, var(--line) 28px),
    var(--card);
  border:1.5px solid var(--line);
  padding:18px 20px 20px 52px;
  margin:16px 0;
}
.heft::before{
  content:"";position:absolute;left:26px;top:0;bottom:0;width:2px;background:var(--mix);opacity:.35;
}
.heft-tag{
  display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:var(--bg);
  font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;margin-bottom:12px;
}
.heft h4{margin:0 0 8px;font-family:'Bricolage Grotesque',sans-serif;font-size:1.05rem;}
.heft ul{margin:6px 0 0;padding-left:20px;}
.heft table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.93rem;}
.heft table th,.heft table td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);}
.check-row{
  display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
}
.check-btn{
  border:1.5px solid var(--line);background:var(--card);border-radius:10px;width:26px;height:26px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:transparent;
}
.check-btn.checked{background:var(--ok);border-color:var(--ok);color:#fff;}
.check-label{font-weight:600;font-size:.95rem;cursor:pointer;}
.check-label.checked{color:var(--ok);}

/* ---------- cost/benefit ---------- */
.cb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
@media (max-width:520px){.cb-grid{grid-template-columns:1fr;}}
.cb-col h4{margin:0 0 8px;font-size:.98rem;}
.cb-item{
  border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
  font-size:.92rem;background:var(--card);
}
.cb-item .reveal{display:none;margin-top:6px;font-size:.87rem;color:var(--ink-soft);}
.cb-item.open{border-style:solid;}
.cb-item.open .reveal{display:block;}
.cb-item.plus{border-color:var(--ok);} .cb-item.plus.open{background:color-mix(in srgb, var(--ok) 10%, var(--card));}
.cb-item.minus{border-color:var(--bad);} .cb-item.minus.open{background:color-mix(in srgb, var(--bad) 8%, var(--card));}

.hintcard{
  border:1.5px solid var(--gold);background:var(--gold-tint);border-radius:12px;padding:12px 14px;margin:8px 0;
  cursor:pointer;font-size:.92rem;
}
.hintcard .hinttitle{font-weight:700;color:var(--gold-deep);}
.hintcard .hintbody{display:none;margin-top:6px;}
.hintcard.open .hintbody{display:block;}

/* ---------- ampel ---------- */
.ampel-row{display:flex;gap:12px;margin:16px 0;}
.ampel-btn{
  flex:1;border:2px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;
  background:var(--card);font-weight:700;font-size:.95rem;
}
.ampel-btn .dotc{width:26px;height:26px;border-radius:50%;margin:0 auto 8px;}
.ampel-btn.rot .dotc{background:#D14343;} .ampel-btn.gelb .dotc{background:#E0AE2E;} .ampel-btn.gruen .dotc{background:#2E9B5C;}
.ampel-btn.sel{border-color:var(--ink);background:var(--gold-tint);}

/* ---------- profi ---------- */
.profi-card{border:1.5px solid var(--profi);border-radius:16px;padding:16px 18px;margin-bottom:14px;background:var(--profi-tint);}
.profi-card h3{margin:0 0 6px;font-size:1.02rem;color:var(--profi-deep);}
.profi-card .snack{font-size:.95rem;}
textarea.research{
  width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
  font-family:inherit;font-size:.92rem;background:var(--card);color:var(--ink);resize:vertical;
}

/* ---------- misc ---------- */
.hotspot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;flex-shrink:0;}
.legend-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.legend-row .em{font-size:1.2rem;}
.counter-pill{display:inline-flex;align-items:center;gap:6px;background:var(--gold-tint);color:var(--gold-deep);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;}
.reset-link{background:none;border:none;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0;}
.speech{
  display:flex;gap:10px;align-items:flex-start;background:var(--mix-tint);border-radius:16px;padding:12px 14px;margin-bottom:16px;
}
.speech .avatar{font-size:1.6rem;flex-shrink:0;}
.speech p{margin:0;font-size:.95rem;}
@media (max-width:480px){
  .brand{display:none;}
  h1.title{font-size:1.4rem;}
  .card{padding:18px 16px;}
  #app{padding:14px 12px 80px;}
}
</style>
</head>

function routeTag(route){

    copy:['📋 Kopier-Route','copy'],
    gold:['⭐ Gemeinsam','gold'],
    profi:['🚀 Profi-Wissen','profi'],

  return `<div class="route-tag ${m[1]}">${m[0]}</div>`;
}

const ENCOURAGE = [

  'Fast! Denk nochmal in Ruhe nach, du kommst der Sache näher.',
  'Nicht ganz richtig, aber kein Problem. Probier eine andere Antwort.',

function itemPoints(state, it){
  if(!state || !state.done) return 0;
  const t = state.tries.length;
  return (t===0 ? 3 : (t===1 ? 1 : 0)) * (it.mult||1);
}
function itemMax(it){ return 3*(it.mult||1); }

function quizBlock(setId, items){
  return items.map((it,i)=>{
    const key = setId+'_'+i;
    const state = quizState[key] || {tries:[], done:false};
    const optsHtml = it.opts.map((o,oi)=>{
      let cls='opt';
      const tried = state.tries.includes(oi);
      if(state.done && oi===it.correct) cls+=' correct';
      else if(tried) cls+=' wrong';
      const disabled = state.done || tried;
      return `<button class="${cls}" data-quiz="${key}" data-correct="${it.correct}" data-oi="${oi}" ${disabled?'disabled':''}>${o}</button>`;
    }).join('');
    let fb = '';
    if(state.done){
      const pts = itemPoints(state, it);
      const first = state.tries.length===0;
      fb = `<div class="feedback show ok"><span class="ptsbadge">+${pts} ${pts===1?'Punkt':'Punkte'}</span>${first?' <b>Direkt richtig!</b> ':' '}${it.explain}</div>`;
    } else if(state.tries.length>0){
      const msg = ENCOURAGE[(state.tries.length-1) % ENCOURAGE.length];
      fb = `<div class="feedback show bad">${msg}</div>`;
    }
    return `<div class="quiz">
      <div class="qhead"><span class="qnum">${i+1}</span><span>${it.q}</span></div>
      ${optsHtml}
      ${fb}
    </div>`;
  }).join('');
}

function quizAllAnswered(setId, items){
  for(let i=0;i<items.length;i++){ const s=quizState[setId+'_'+i]; if(!s || !s.done) return false; }
  return true;
}

function setStats(set){
  let pts=0, max=0, first=0, done=0; const missed=[];
  set.items.forEach((it,i)=>{
    const s = quizState[set.id+'_'+i];
    max += itemMax(it);
    if(s && s.done){
      done++; pts += itemPoints(s,it);
      if(s.tries.length===0) first++; else missed.push(it);
    }
  });
  return {pts, max, first, done, total:set.items.length, missed};
}
function totalPoints(){ return SETS.reduce((a,s)=>a+setStats(s).pts,0) + sortPoints(); }
function gateOk(k){
  const id = STEPS[k].id;
  const set = SETS.find(s=>s.step===id);
  if(set) return quizAllAnswered(set.id, set.items);
  if(id==='flower'){ const o=lget('fp_flower_open',{}); return FLOWER_PARTS.every(p=>o[p.id]); }
  if(id==='copyExamples'){ const o=lget('fp_stations',{}); return BEISPIELE.every(b=>o[b.id]); }
  if(id==='costBenefit') return hintsSeen()===HILFEKARTEN.length && sortComplete();
  if(id==='ampel') return !!lget('fp_ampel',null);
  return true;
}
function canJump(i){
  if(i===cur || !visited.includes(i)) return false;
  if(i<cur) return true;
  for(let k=cur;k<i;k++){ if(!gateOk(k)) return false; }
  return true;
}
function stepIndex(id){ return STEPS.findIndex(s=>s.id===id); }
function shortQ(q){ q=q.replace(/[„“"]/g,''); return q.length>85 ? q.slice(0,82)+'…' : q; }

  return `<div class="overview">

const SORT_ZONES = [
  {key:'mix_nutzen', label:'🧬 Mix-Route: Nutzen', cls:'mix'},
  {key:'mix_kosten', label:'🧬 Mix-Route: Kosten', cls:'mix'},
  {key:'copy_nutzen', label:'📋 Kopier-Route: Nutzen', cls:'copy'},
  {key:'copy_kosten', label:'📋 Kopier-Route: Kosten', cls:'copy'},
];
const SORT_ITEMS = (()=>{
  const groups = [['copy','plus'],['mix','minus'],['copy','minus'],['mix','plus']];
  const out = [];
  for(let i=0;i<3;i++) groups.forEach(([r,c])=>{
    const it = KB[r][c][i];
    out.push({id:r+'_'+c+'_'+i, t:it.t, b:it.b, zone:r+'_'+(c==='plus'?'nutzen':'kosten')});
  });
  return out;
})();
const SORT_WRONG = [
  'Das passt dort noch nicht. Überlege: Zu welcher Route gehört die Karte, und ist es ein Nutzen oder ein Preis (Kosten)?',
  'Noch nicht ganz. Denk an die Hilfekarten: Was bedeutet das für Zeit, Energie, Vielfalt oder Ausbreitung?',
  'Das ist es noch nicht. Probier ein anderes Feld aus, du schaffst das.',
];
let selChip = null, sortMsg = '';
function sortState(){ const s = lget('fp_sort', {}); return {placed:s.placed||{}, wrong:s.wrong||{}}; }
function sortPoints(){ const s=sortState(); return SORT_ITEMS.filter(it=>s.placed[it.id] && !(s.wrong[it.id]>0)).length; }
function sortComplete(){ const s=sortState(); return SORT_ITEMS.every(it=>s.placed[it.id]); }
function hintsSeen(){ const s=lget('fp_hint_seen',{}); return HILFEKARTEN.filter((x,i)=>s[i]).length; }
function tryPlace(chipId, zoneKey){
  const it = SORT_ITEMS.find(x=>x.id===chipId);
  if(!it) return;
  const s = sortState();
  if(s.placed[chipId]) return;
  if(it.zone===zoneKey){ s.placed[chipId]=true; sortMsg='✅ Passt!'; selChip=null; }
  else { s.wrong[chipId]=(s.wrong[chipId]||0)+1; sortMsg=SORT_WRONG[(s.wrong[chipId]-1)%SORT_WRONG.length]; }
  lset('fp_sort', s);
  render();
}

function stepCostBenefit(){
  const openH = lget('fp_hint', {});
  const seen = hintsSeen();
  const allHints = seen===HILFEKARTEN.length;
  const hints = HILFEKARTEN.map((hk,i)=>{
    const isOpen = !!openH[i];
    return `<div class="hintcard ${isOpen?'open':''}" data-hint="${i}"><div class="hinttitle">💡 ${hk.t} ${isOpen?'':'<span class="muted" style="font-weight:400;">(antippen)</span>'}</div><div class="hintbody">${hk.b}</div></div>`;
  }).join('');
  let sortHtml = '';
  if(!allHints){
    sortHtml = `<p class="muted"><b>Öffne zuerst alle vier Hilfekarten (${seen} von ${HILFEKARTEN.length})</b> und lies sie in Ruhe. Danach geht es mit dem Sortieren weiter.</p>`;
  } else {
    const s = sortState();
    const pool = SORT_ITEMS.filter(it=>!s.placed[it.id]);
    const poolHtml = pool.map(it=>`<div class="chip ${selChip===it.id?'sel':''}" draggable="true" data-chip="${it.id}">${it.t}</div>`).join('');
    const zonesHtml = SORT_ZONES.map(z=>{
      const placed = SORT_ITEMS.filter(it=>it.zone===z.key && s.placed[it.id]);
      return `<div class="zone ${z.cls}" data-zone="${z.key}"><div class="zone-h">${z.label}</div>
        ${placed.map(it=>`<div class="placed"><b>${it.t}</b><div class="pb">${it.b}</div></div>`).join('')}
        ${placed.length===0?'<div class="zone-empty">hierher ziehen oder tippen</div>':''}</div>`;
    }).join('');
    const complete = sortComplete();
    sortHtml = `
      <h3 class="h3">Jetzt sortieren</h3>
      <p class="lead" style="margin-top:0;">Ziehe jede Karte in das passende Feld. Am Tablet oder Handy: Karte antippen, dann das Feld antippen.</p>
      <div class="pool">${poolHtml || '<span class="muted">Alle Karten sind einsortiert.</span>'}</div>
      <div class="sortmsg">${sortMsg}</div>
      <div class="zones">${zonesHtml}</div>
      ${complete?`<p class="counter-pill" style="margin-top:12px;">🎉 Alle 12 Karten richtig zugeordnet: +${sortPoints()} Punkte (1 Punkt je Karte, die direkt gepasst hat)</p>`:''}`;
  }
  const ok = allHints && sortComplete();
  return wrap(STEPS[8], `

    <div class="think-box">
      <div class="tb-label">Erstmal selber denken</div>

    </div>
    ${hints}
    ${sortHtml}
    <div class="btnrow"><button class="btn btn-primary copy" data-nav="next" ${ok?'':'disabled'}>${ok?'Weiter':(allHints?'Erst alle Karten einsortieren':'Erst alle Hilfekarten lesen')}</button></div>
  `);
}

    <div class="ampel-row">${opts.map(o=>`<div class="ampel-btn ${o[0]} ${sel===o[0]?'sel':''}" data-ampel="${o[0]}"><div class="dotc"></div>${o[2]}</div>`).join('')}</div>
    <div class="btnrow"><button class="btn btn-primary gold" data-nav="next" ${sel?'':'disabled'}>${sel?'Weiter zum Abschlusstest':'Wähle eine Einschätzung'}</button></div>
  `);
}

function stepFinalTest(){
  const items = QUIZ_TEST;
  const all = quizAllAnswered('finalTest', items);
  const st = setStats({id:'finalTest', items});
  return wrap(STEPS[12], `
    <h2 class="h">Abschlusstest</h2>
    <p class="lead">${items.length} Fragen quer durch das ganze Thema, ein paar davon zum Knobeln. Direkt richtig gibt 3 Punkte.</p>
    ${quizBlock('finalTest', items)}
    ${all? `<p class="counter-pill">🏆 ${st.pts} von ${st.max} Punkten, ${st.first} von ${st.total} direkt richtig</p>` : ''}
    <div class="btnrow"><button class="btn btn-primary profi" data-nav="next" ${all?'':'disabled'}>${all?'Weiter':'Beantworte erst alle Fragen'}</button></div>
  `);
}

function stepDone(){
  return wrap(STEPS[13], `
    <h2 class="h">Pflichtprogramm geschafft! 🎉</h2>
    <p class="lead">Du kennst jetzt beide Fortpflanzungs-Routen der Pflanzen: die vielfältige Mix-Route und die schnelle Kopier-Route.</p>
    ${overviewHtml()}
    <p class="muted" style="margin-top:14px;">Ab hier geht's freiwillig weiter: spannendes Profi-Wissen mit Knobelfragen für alle, die noch mehr wissen wollen.</p>
    <div class="btnrow">
      <button class="btn btn-primary profi" data-nav="next">🚀 Weiter zu den Profi-Aufgaben</button>
      <button class="btn btn-ghost" data-nav="finish">Für heute reicht's mir</button>
    </div>
  `);
}

function stepProfiIntro(){
  return wrap(STEPS[14], `
    <h2 class="h">Profi-Wissen 🚀</h2>
    <p class="lead">Hier wartet spannender Zusatzstoff: Geschichten, kniffligere Fragen und ein eigener Forschungsauftrag. Nimm dir ruhig Zeit dafür.</p>
    <div class="legend-row"><span class="em">🍌👯🧬</span><span>Drei kurze „Wissen to go"-Häppchen</span></div>
    <div class="legend-row"><span class="em">🌳🥔</span><span>Zwei ausführliche Profi-Reportagen zum Lesen</span></div>
    <div class="legend-row"><span class="em">🧩🔍</span><span>Kniffel-Rätsel und ein offener Forschungsauftrag</span></div>
    <div class="btnrow"><button class="btn btn-primary profi" data-nav="next">Los geht's</button></div>
  `);
}

function profiSnackStep(step, key, p){
  const items=[p.quiz];
  return wrap(step, `
    <div class="profi-card" style="margin:0;">
      <h3>${p.icon} ${p.title}</h3>
      <p class="snack">${p.body}</p>
      ${quizBlock(key, items)}
    </div>
    <div class="btnrow"><button class="btn btn-primary profi" data-nav="next" ${quizAllAnswered(key,items)?'':'disabled'}>${quizAllAnswered(key,items)?'Weiter':'Beantworte erst die Frage'}</button></div>
  `);
}
function stepProfiBanana(){ return profiSnackStep(STEPS[15], 'profiBanana', PROFI[0]); }
function stepProfiTwins(){ return profiSnackStep(STEPS[16], 'profiTwins', PROFI[1]); }
function stepProfiGenes(){ return profiSnackStep(STEPS[17], 'profiGenes', PROFI[2]); }

function profiLongStep(step, key, data, illustration, caption){
  const all = quizAllAnswered(key, data.quiz);
  return wrap(step, `
    <h2 class="h">${data.title}</h2>
    ${illustration ? `<div class="hero-wrap" style="text-align:center;">${illustration}${caption?`<p class="muted" style="font-size:.85rem;margin-top:6px;">${caption}</p>`:''}</div>` : ''}
    ${data.paragraphs.map(p=>`<p>${p}</p>`).join('')}
    <h3 class="h3">Verstanden?</h3>
    ${quizBlock(key, data.quiz)}
    <div class="btnrow"><button class="btn btn-primary profi" data-nav="next" ${all?'':'disabled'}>${all?'Weiter':'Beantworte erst alle Fragen'}</button></div>
  `);
}
function stepProfiApple(){ return profiLongStep(STEPS[18], 'profiApple', PROFI_APPLE, `<img class="exp-img" src="${IMG.veredelung}" alt="Veredelungsstelle an einem Apfelbaum" style="max-width:520px;">`, 'So kann eine Veredelungsstelle am Stamm aussehen: Der aufgesetzte Zweig (Edelreis) ist festgebunden und mit Wachs verschlossen. Das Bild ist KI-generiert und dient der Veranschaulichung.'); }
function stepProfiPotato(){ return profiLongStep(STEPS[19], 'profiPotato', PROFI_POTATO, svgBlight(), 'Alle Pflanzen sind genetisch gleich – der Pilz trifft sie deshalb alle gleich leicht.'); }

function stepProfiKniffel(){
  const all = quizAllAnswered('kniffel', KNIFFEL);
  return wrap(STEPS[20], `
    <h2 class="h">🧩 Kniffel-Rätsel</h2>
    <p class="lead">Jetzt wird's richtig kniffelig: Hier musst du kombinieren und überlegen, nicht nur erinnern. Dafür gibt es <b>doppelte Punkte</b> (direkt richtig = 6 Punkte).</p>
    ${quizBlock('kniffel', KNIFFEL)}
    <div class="btnrow"><button class="btn btn-primary profi" data-nav="next" ${all?'':'disabled'}>${all?'Weiter':'Beantworte erst alle Fragen'}</button></div>
  `);
}

function stepProfiResearch(){
  const research = lget('fp_research','');
  return wrap(STEPS[21], `
    <h2 class="h">🔍 Du hast es dir verdient!</h2>
    <p class="lead">Du warst richtig fleißig und hast alles geschafft. Als Belohnung darfst du jetzt selbst im Internet recherchieren – zum Beispiel mit einer Suchmaschine oder auf einer Wissens-Seite wie Wikipedia.</p>
    <h3 class="h3">Deine Aufgabe</h3>
    <p>Wähle <b>einen</b> Organismus aus – zum Beispiel einen Pilz, einen Farn oder eine Qualle (oder such dir selbst etwas anderes aus). Finde heraus:</p>
    <ul style="margin:0 0 14px 20px;">
      <li>Pflanzt er sich geschlechtlich, ungeschlechtlich oder auf beide Arten fort?</li>
      <li>Wie genau läuft das bei ihm ab?</li>
    </ul>
    <p>Notiere in 2–3 Sätzen, was du herausgefunden hast – und woher deine Info stammt.</p>
    <textarea class="research" placeholder="Meine Notizen …" data-research="1">${researchEscaped(research)}</textarea>
    <div class="btnrow"><button class="btn btn-primary mix" data-nav="next">Zum Abschluss</button></div>
  `);
}
function researchEscaped(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function stepEnd(){
  const paused = lget('fp_paused', false);
  if(paused){
    return wrap(STEPS[22], `
      <h2 class="h">Stark gemacht! 💪</h2>
      <p class="lead">Du warst richtig fleißig und hast das komplette Pflichtprogramm geschafft. Mach jetzt ruhig eine Pause!</p>
      <p>Wenn du später noch Zeit und Lust hast, kannst du genau hier weitermachen und ins Profi-Wissen eintauchen, mit spannenden Geschichten über Bananen-Klone, Apfelbäume und eine Kartoffel-Hungersnot.</p>
      ${overviewHtml()}
      <div class="btnrow">
        <button class="btn btn-primary profi" data-nav="gotoProfi">🚀 Doch noch zu den Profi-Aufgaben</button>
        <button class="btn btn-ghost" data-nav="restart">Alles nochmal von vorn</button>
      </div>
    `);
  }
  return wrap(STEPS[22], `
    <h2 class="h">Alles geschafft! 🌟</h2>
    <p class="lead">Super gemacht! Du hast dich durch beide Fortpflanzungs-Routen gearbeitet und sogar durchs komplette Profi-Wissen.</p>
    ${overviewHtml()}
    <div class="btnrow">
      <button class="btn btn-ghost" data-nav="restart">Nochmal von vorn</button>
    </div>
  `);
}

const RENDERERS = [stepStart, stepFlower, stepPollination, stepMixQuiz, stepMixHeft, stepCopyIntro, stepCopyExamples, stepCopyHeft, stepCostBenefit, stepVorNachteilHeft, stepCopyQuiz, stepAmpel, stepFinalTest, stepDone, stepProfiIntro, stepProfiBanana, stepProfiTwins, stepProfiGenes, stepProfiApple, stepProfiPotato, stepProfiKniffel, stepProfiResearch, stepEnd];

/* ============================================================
   MAIN RENDER
   ============================================================ */
function trailHtml(){
  return STEPS.map((s,i)=>{
    const seen = visited.includes(i) || i===cur;
    const jump = canJump(i);
    const cls = seen ? 'done '+s.route+(i===cur?' now':'')+(jump?' go':'') : '';
    const attr = jump ? ` data-goto="${i}" title="Zu Seite ${i+1}"` : '';
    return `<i class="${cls}"${attr}></i>`;
  }).join('');
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="dna">🧬</span>Fortpflanzung</div>
      <div class="trail">${trailHtml()}</div>
      <div class="pts" title="Deine Punkte">⭐ ${totalPoints()}</div>
      <button class="theme-toggle" id="themeToggle" title="Hell/Dunkel umschalten">🌗</button>
    </div>
    ${RENDERERS[cur]()}
  `;
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
}

function goTo(i){
  selChip=null; sortMsg='';
  cur = Math.max(0, Math.min(STEPS.length-1, i));
  lset('fp_step', cur);
  markVisited(cur);
  render();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

function toggleTheme(){
  const root = document.documentElement;
  const cScheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
  const currentAttr = root.getAttribute('data-theme') || cScheme;
  root.setAttribute('data-theme', currentAttr==='dark' ? 'light' : 'dark');
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', function(e){
  const nav = e.target.closest('[data-nav]');
  if(nav){
    const action = nav.getAttribute('data-nav');
    if(action==='next') goTo(cur+1);
    else if(action==='back'){ let t=cur-1; while(t>0 && !visited.includes(t)) t--; goTo(Math.max(0,t)); }
    else if(action==='finish'){ lset('fp_paused', true); goTo(STEPS.length-1); }
    else if(action==='gotoProfi'){ lset('fp_paused', false); goTo(14); }
    else if(action==='restart'){
      lset('fp_step',0);
      visited=[0]; lset('fp_visited',[0]);
      lset('fp_quiz',{});
      lset('fp_heft',{});
      lset('fp_stations',{});
      lset('fp_hint',{});
      lset('fp_ampel',null);
      lset('fp_research','');
      lset('fp_flower_open', {});
      lset('fp_cb_revealed', false); lset('fp_sort',{}); lset('fp_hint_seen',{}); selChip=null; sortMsg='';
      lset('fp_paused', false);
      quizState={}; heftState={};
      cur=0; render();
    }
    return;
  }
  const gt = e.target.closest('[data-goto]');
  if(gt){
    const i = parseInt(gt.getAttribute('data-goto'),10);
    if(canJump(i)) goTo(i);
    return;
  }
  const quizBtn = e.target.closest('[data-quiz]');
  if(quizBtn){
    const key = quizBtn.getAttribute('data-quiz');
    const state = quizState[key] || {tries:[], done:false};
    if(state.done) return;
    const oi = parseInt(quizBtn.getAttribute('data-oi'),10);
    if(state.tries.includes(oi)) return;
    const correct = parseInt(quizBtn.getAttribute('data-correct'),10);
    if(oi===correct){ state.done = true; } else { state.tries = [...state.tries, oi]; }
    quizState[key] = state; saveQuizState(); render();
    return;
  }
  const heftBtn = e.target.closest('[data-heftcheck]');
  if(heftBtn){
    const id = heftBtn.getAttribute('data-heftcheck');
    heftState[id] = !heftState[id]; saveHeftState(); render();
    return;
  }
  const fp = e.target.closest('[data-flowerstation]');
  if(fp){
    const id = fp.getAttribute('data-flowerstation');
    const openSet = lget('fp_flower_open', {});
    openSet[id] = !openSet[id];
    lset('fp_flower_open', openSet);
    render();
    return;
  }
  const chip = e.target.closest('[data-chip]');
  if(chip){
    const id = chip.getAttribute('data-chip');
    selChip = (selChip===id) ? null : id;
    sortMsg = '';
    render();
    return;
  }
  const zone = e.target.closest('[data-zone]');
  if(zone){
    if(selChip) tryPlace(selChip, zone.getAttribute('data-zone'));
    return;
  }
  const st = e.target.closest('[data-station]');
  if(st){
    const id = st.getAttribute('data-station');
    const openSet = lget('fp_stations', {});
    openSet[id] = !openSet[id];
    lset('fp_stations', openSet);
    render();
    return;
  }
  const hint = e.target.closest('[data-hint]');
  if(hint){
    const i = hint.getAttribute('data-hint');
    const openH = lget('fp_hint', {});
    openH[i] = !openH[i];
    lset('fp_hint', openH);
    if(openH[i]){ const sn = lget('fp_hint_seen',{}); sn[i]=true; lset('fp_hint_seen', sn); }
    render();
    return;
  }
  const amp = e.target.closest('[data-ampel]');
  if(amp){
    lset('fp_ampel', amp.getAttribute('data-ampel'));
    render();
    return;
  }
});

document.addEventListener('dragstart', function(e){
  const c = e.target.closest && e.target.closest('[data-chip]');
  if(c){ e.dataTransfer.setData('text/plain', c.getAttribute('data-chip')); e.dataTransfer.effectAllowed = 'move'; }
});
document.addEventListener('dragover', function(e){
  const z = e.target.closest && e.target.closest('[data-zone]');
  if(z) e.preventDefault();
});
document.addEventListener('drop', function(e){
  const z = e.target.closest && e.target.closest('[data-zone]');
  if(z){ e.preventDefault(); tryPlace(e.dataTransfer.getData('text/plain'), z.getAttribute('data-zone')); }
});

document.addEventListener('input', function(e){
  if(e.target.matches('[data-research]')){
    lset('fp_research', e.target.value);
  }
});

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  quizState = lget('fp_quiz', {});
  heftState = lget('fp_heft', {});
  markVisited(cur);
  render();
})();
</script>
</body>
</html>
